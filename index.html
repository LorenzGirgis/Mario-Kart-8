<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mario Kart 8 &mdash; Mode 7 Edition</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="frame">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="boot">BUILDING TRACK&hellip;</div>
  </div>
  <div id="hint">
    <span><b>&uarr;/W</b> accelerate</span>
    <span><b>&darr;/S</b> brake</span>
    <span><b>&larr;&rarr;</b> steer</span>
    <span><b>Z / Shift</b> hop &amp; drift</span>
    <span><b>Space</b> use item</span>
    <span><b>Enter</b> confirm</span>
    <span><b>P</b> pause</span>
    <span><b>M</b> mute</span>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/tracks.js"></script>
  <script src="js/trackbuilder.js"></script>
  <script src="js/mode7.js"></script>
  <script src="js/items.js"></script>
  <script src="js/kart.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/race.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
